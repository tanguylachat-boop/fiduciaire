[project]
name = "fiduciaire-worker"
version = "0.1.0"
description = "POC ingestion documentaire offline pour cabinet fiduciaire"
requires-python = ">=3.12"
dependencies = [
  "watchdog>=4.0",
  "pytesseract>=0.3.13",
  "pdf2image>=1.17",
  "pypdf>=5.0",
  "pillow>=10.4",
  "pyzbar>=0.1.9",        # Swiss QR-bill detection (requires `brew install zbar`)
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.9",
  "rich>=13.9",
  "python-dotenv>=1.0",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[project.scripts]
fiduciaire-worker = "fiduciaire_worker.__main__:main"
fiduciaire-bench = "fiduciaire_worker.scripts.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiduciaire_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
